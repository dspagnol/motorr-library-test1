%YAML 1.2
---
schema_version: 1
package:
  code: "ufc"
  version: "0.1.0"
core_compatibility:
  min: "0.0.1"
topic:
  code: "ufc"
  name: "UFC"
  description: "The Ultimate Fighting Championship (UFC) is an American mixed martial arts (MMA) promotion company based in Las Vegas, Nevada."
schedule:
  schedule_url: "https://raw.githubusercontent.com/dspagnol/motorr-schedule-test1/main/ufc"
torrent_acquisition:
  - id: "torrent_query_1"
    applies_to:
      event_codes:
        - "01epc"
        - "02pc"
        - "03mc"
    indexer_capabilities:
      - "public-sports"
    query_template: "full event eng"
    listing_title_regex: "(?i).*Full Event.*Eng.*"
    torrent_name_regex: ".*.*"
  - id: "torrent_query_2"
    applies_to:
      event_codes:
        - "01epc"
        - "02pc"
        - "03mc"
    indexer_capabilities:
      - "public-sports"
    query_template: "prelims main card en"
    listing_title_regex: "(?i).*Prelims.*Main Card.*Eng.*"
    torrent_name_regex: ".*.*"
  - id: "torrent_query_3"
    applies_to:
      event_codes:
        - "01epc"
        - "02pc"
        - "03mc"
    indexer_capabilities:
      - "public-sports"
    query_template: "ufc ${season.code} round${round.code}"
    listing_title_regex: "(?i).*"
    torrent_name_regex: ".*.*"
file_matchers:
  - id: "torrent_query_1-torrent-file-torrent-01r"
    applies_to:
      event_codes:
        - "01epc"
        - "02pc"
        - "03mc"
      source_kinds:
        - "torrent"
    priority: 50
    relative_path_regex: ".*"
  - id: "torrent_query_2-torrent-file-torrent-01r"
    applies_to:
      event_codes:
        - "01epc"
        - "02pc"
        - "03mc"
      source_kinds:
        - "torrent"
    priority: 50
    relative_path_regex: ".*(?:\\W.*)?\\.(?:mkv|mp4)$"
  - id: "torrent_query_3-torrent-file-torrent-01r"
    applies_to:
      event_codes:
        - "01epc"
        - "02pc"
        - "03mc"
      source_kinds:
        - "torrent"
    priority: 45
    relative_path_regex: ".*"
...
