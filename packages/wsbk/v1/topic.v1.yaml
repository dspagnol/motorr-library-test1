    - 05r1
  indexer_capabilities:
  - uindex
  query_template: wsbk ${season.code} round${round.code}
  listing_title_regex: WSBK ${season.code} Round${round.code} .+ Race One WEB-DL .*
  torrent_name_regex: WSBK ${season.code} Round${round.code} .+ Race One WEB-DL .*
- id: torrent_candidate_uindex-6
  applies_to:
    event_codes:
    - 06wu
  indexer_capabilities:
  - uindex
