schema_version: 1
package:
  code: wsbk
  version: 0.1.0
core_compatibility:
  min: 0.0.1
topic:
  code: wsbk
  name: WorldSBK
  description: 'Superbike World Championship (also known as WorldSBK, SBK, World Superbike,
    WSB, or WSBK) is a

    silhouette road racing series based on heavily modified production sports motorcycles.'
variables:
  watch_token:
    type: select
    select:
      field: event.code
      values:
        01p1: FP1
        02p2: FP2
        03p3: FP3
        04s: SPole
        05r1: RACE_1
        06wu: WUP
torrent_acquisition:
- id: torrent_candidate_rutrackerorg
  applies_to:
    event_codes:
    - 01p1
    - 02p2
    - 03p3
    - 04s
    - 05r1
    - 06wu
    - 07sr
    - 08r2
  indexer_capabilities:
  - rutracker
  query_template: wsbk ${season.code} ${round.code} eng
  listing_title_regex: WSBK(?:\W|\W.*\W)${season.code}(?:\W|\W.*\W)${round.code}(?:\W|\W.*\W).*(?:\W|\W.*\W)ENG
  torrent_name_regex: WSBK\.${season.code}\.Round${round.code}\..+
- id: torrent_candidate_uindex
  applies_to:
    event_codes:
    - 01p1
  indexer_capabilities:
  - uindex
  query_template: wsbk ${season.code} round${round.code}
  listing_title_regex: WSBK ${season.code} Round${round.code} .+ FP1 WEB-DL .*
  torrent_name_regex: WSBK ${season.code} Round${round.code} .+ FP1 WEB-DL .*
- id: torrent_candidate_uindex-2
  applies_to:
    event_codes:
    - 02p2
  indexer_capabilities:
  - uindex
  query_template: wsbk ${season.code} round${round.code}
  listing_title_regex: WSBK ${season.code} Round${round.code} .+ FP2 WEB-DL .*
  torrent_name_regex: WSBK ${season.code} Round${round.code} .+ FP2 WEB-DL .*
- id: torrent_candidate_uindex-3
  applies_to:
    event_codes:
    - 03p3
  indexer_capabilities:
  - uindex
  query_template: wsbk ${season.code} round${round.code}
  listing_title_regex: WSBK ${season.code} Round${round.code} .+ FP3 WEB-DL .*
  torrent_name_regex: WSBK ${season.code} Round${round.code} .+ FP3 WEB-DL .*
- id: torrent_candidate_uindex-4
  applies_to:
    event_codes:
    - 04s
  indexer_capabilities:
  - uindex
  query_template: wsbk ${season.code} round${round.code}
  listing_title_regex: WSBK ${season.code} Round${round.code} .+ Superpole WEB-DL
    .*
  torrent_name_regex: WSBK ${season.code} Round${round.code} .+ Superpole WEB-DL .*
- id: torrent_candidate_uindex-5
