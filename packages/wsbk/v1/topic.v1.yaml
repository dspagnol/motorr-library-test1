- id: torrent_candidate_uindex-8
  applies_to:
    event_codes:
    - 08r2
  indexer_capabilities:
  - uindex
  query_template: wsbk ${season.code} round${round.code}
  listing_title_regex: WSBK ${season.code} Round${round.code} .+ Race Two WEB-DL .*
  torrent_name_regex: WSBK ${season.code} Round${round.code} .+ Race Two WEB-DL .*
- id: torrent_query
  applies_to:
    event_codes:
    - 01p1
    - 02p2
    - 03p3
    - 04s
    - 05r1
    - 06wu
    - 07sr
    - 08r2
  indexer_capabilities:
  - public-sports
  query_template: wsbk ${season.code} round${round.code}
file_matchers:
- id: import-dir-motomundo-import-file-watch-directory-selector
  applies_to:
    event_codes:
    - 01p1
    - 02p2
    - 03p3
    - 04s
    - 05r1
    - 06wu
    source_kinds:
    - watch_directory
  priority: 10
  relative_path_regex: '[0-9]+\.MotoMundo\.net\.${season.code}\.R${round.code}\.SBK\.\w+\.${var.watch_token}\.(?:mp4|mkv)$'
- id: import_dir_motomundo-import-file-watch_directory-07sr
  applies_to:
    event_codes:
    - 07sr
    source_kinds:
    - watch_directory
  priority: 10
  relative_path_regex: '[0-9]+\.MotoMundo\.net\.${season.code}\.R${round.code}\.SBK\.\w+\.(?:SPole|SP)[_\.]?RACE\.(?:mp4|mkv)$'
- id: import_dir_motomundo-import-file-watch_directory-08r2
  applies_to:
    event_codes:
    - 08r2
    source_kinds:
    - watch_directory
  priority: 10
  relative_path_regex: '[0-9]+\.MotoMundo\.net\.${season.code}\.R${round.code}\.SBK\.\w+\.RACE_2(?:-Provisional)?\.(?:mp4|mkv)$'
- id: torrent_candidate_rutrackerorg-dictionary-file-torrent-01p1
  applies_to:
    event_codes:
    - 01p1
    source_kinds:
    - torrent
  priority: 50
  relative_path_regex: '[0-9]{2}\. W?SBK/(?:(?:[0-9]{2} - SBK\.${season.code}\.${round.code}\..+\.Grand\.Prix\.Practice\.(?:1|One)\.(?:ZXX.|ENGLISH.|MULTi.)+(?:1080p|720p)\..+.(?:mkv|mp4))|(?:[0-9]{2}\.MotoMundo-WSBK\.${season.code}\.R${round.code}\..+\.FP1\.mp4))$'
