  priority: 50
  relative_path_regex: (?:(?:[0-9]{2}\. MotoE/[0-9]{2}[a-z]?\.ME\..+\.${season.code}\.RACE2\.(?:1080p|720p).+\.mkv)|(?:[0-9]{2}\.
