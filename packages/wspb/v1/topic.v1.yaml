schema_version: 1
package:
  code: wspb
  version: 0.1.0
core_compatibility:
  min: 0.0.1
topic:
  code: wspb
  name: WorldSPB
  description: The Sportbike World Championship (or short abbreviated as WorldSPB)
    is a motorcycle racing competition on paved surfaces, for production-based motorcycles.
    The class replaced the Supersport 300 World Championship which ran for nine seasons
    as the support class for the Superbike World Championship from 2017 up to 2025.
variables:
  watch_token:
    type: select
    select:
      field: event.code
      values:
        01p: FP
        02s: SPole
        04r1: RACE_1
        06r2: RACE_2
schedule:
  schedule_url: https://raw.githubusercontent.com/dspagnol/motorr-schedule-test1/main/wspb

torrent_acquisition:
- id: torrent_query
  applies_to:
    event_codes:
    - 01p
    - 02s
    - 03wu1
    - 04r1
    - 05wu2
    - 06r2
  indexer_capabilities:
  - public-sports
  query_template: wspb ${season.code} round${round.code}
  torrent_name_regex: WSBK\.${season.code}\.Round.*\..+
file_matchers:
- id: import-dir-motomundo-import-file-watch-directory-selector
  applies_to:
    event_codes:
    - 01p
    - 02s
    - 04r1
    - 06r2
    source_kinds:
    - watch_directory
  priority: 10
  relative_path_regex: '[0-9]+\.MotoMundo\.net\.${season.code}\.R.*\.SPB\.\w+\.${var.watch_token}\.(?:mp4|mkv)$'
- id: import_dir_motomundo-import-file-watch_directory-03wu1
  applies_to:
    event_codes:
    - 03wu1
    source_kinds:
    - watch_directory
  priority: 10
  relative_path_regex: '[0-9]+\.MotoMundo\.net\.${season.code}\.R.*\.SPB\.\w+\.WUP_?1\.(?:mp4|mkv)$'
- id: import_dir_motomundo-import-file-watch_directory-05wu2
  applies_to:
    event_codes:
    - 05wu2
    source_kinds:
    - watch_directory
  priority: 10
  relative_path_regex: '[0-9]+\.MotoMundo\.net\.${season.code}\.R.*\.SPB\.\w+\.WUP_?2\.(?:mp4|mkv)$'
- id: torrent_query-torrent-file-torrent-01p
  applies_to:
    event_codes:
    - 01p
    source_kinds:
    - torrent
  priority: 50
  relative_path_regex: (?:(?:[0-9]{2}\. WSPB/[0-9]{2} - SPB\.${season.code}\..*\..+\.Grand\.Prix\.Practice\.(?:ZXX.|ENGLISH.|MULTi.)+(?:1080p|720p)\..+.(?:mkv|mp4))|(?:[0-9]{2}\.
    WSPB/[0-9]{2}\.MotoMundo-SPB\.${season.code}\.R.*\..+\.FP\.mp4))$
- id: torrent_query-torrent-file-torrent-02s
  applies_to:
    event_codes:
    - 02s
    source_kinds:
    - torrent
  priority: 50
  relative_path_regex: (?:(?:[0-9]{2}\. WSPB/[0-9]{2} - SPB\.${season.code}\..*\..+\.Grand\.Prix\.Superpole\.(?:ZXX.|ENGLISH.|MULTi.)+(?:1080p|720p)\..+.(?:mkv|mp4))|(?:[0-9]{2}\.
    WSPB/[0-9]{2}\.MotoMundo-SPB\.${season.code}\.R.*\..+\.SPole\.mp4))$
- id: torrent_query-torrent-file-torrent-03wu1
  applies_to:
    event_codes:
    - 03wu1
    source_kinds:
    - torrent
  priority: 50
  relative_path_regex: (?:(?:[0-9]{2}\. WSPB/[0-9]{2} - SPB\.${season.code}\..*\..+\.Grand\.Prix\.Warm(?:ing)?.Up\.(?:1|One)\.(?:ZXX.|ENGLISH.|MULTi.)+(?:1080p|720p)\..+.(?:mkv|mp4))|(?:[0-9]{2}\.
    WSPB/[0-9]{2}\.MotoMundo-SPB\.${season.code}\.R.*\..+\.WUP1\.mp4))$
- id: torrent_query-torrent-file-torrent-04r1
  applies_to:
    event_codes:
    - 04r1
    source_kinds:
    - torrent
  priority: 50
  relative_path_regex: (?:(?:[0-9]{2}\. WSPB/[0-9]{2} - SPB\.${season.code}\..*\..+\.Grand\.Prix\.Race\.(?:1|One)\.(?:ZXX.|ENGLISH.|MULTi.)+(?:1080p|720p)\..+.(?:mkv|mp4))|(?:[0-9]{2}\.
    WSPB/[0-9]{2}\.MotoMundo-SPB\.${season.code}\.R.*\..+\.Race1\.mp4))$
- id: torrent_query-torrent-file-torrent-05wu2
  applies_to:
    event_codes:
    - 05wu2
    source_kinds:
    - torrent
  priority: 50
  relative_path_regex: (?:(?:[0-9]{2}\. WSPB/[0-9]{2} - SPB\.${season.code}\..*\..+\.Grand\.Prix\.Warm(?:ing)?.Up\.(?:2|Two)\.(?:ZXX.|ENGLISH.|MULTi.)+(?:1080p|720p)\..+.(?:mkv|mp4))|(?:[0-9]{2}\.
    WSPB/[0-9]{2}\.MotoMundo-SPB\.${season.code}\.R.*\..+\.WUP2\.mp4))$
- id: torrent_query-torrent-file-torrent-06r2
  applies_to:
    event_codes:
    - 06r2
    source_kinds:
    - torrent
  priority: 50
  relative_path_regex: (?:(?:[0-9]{2}\. WSPB/[0-9]{2} - SPB\.${season.code}\..*\..+\.Grand\.Prix\.Race\.(?:2|Two)\.(?:ZXX.|ENGLISH.|MULTi.)+(?:1080p|720p)\..+.(?:mkv|mp4))|(?:[0-9]{2}\.
    WSPB/[0-9]{2}\.MotoMundo-SPB\.${season.code}\.R.*\..+\.Race2\.mp4))$
