  priority: 50
  relative_path_regex: (?:(?:[0-9]{2}\. (?:SSP600|WSSP)/[0-9]{2} - SSP600\.${season.code}\.${round.code}\..+\.Grand\.Prix\.Warm(?:ing)?.Up\.(?:2|Two)\.(?:ZXX.|ENGLISH.|MULTi.)+(?:1080p|720p)\..+.(?:mkv|mp4))|(?:[0-9]{2}\.
    (?:SSP600|WSSP)/[0-9]{2}\.MotoMundo-WSSP\.${season.code}\.R${round.code}\..+\.WUP2\.mp4))$
