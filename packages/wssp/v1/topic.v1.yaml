schema_version: 1
package:
  code: wssp
  version: 0.1.0
core_compatibility:
  min: 0.0.1
topic:
  code: wssp
  name: WorldSSP
  description: 'The Supersport World Championship, abbreviated to WorldSSP, is a motorcycle
    racing competition on hard-surfaced circuits, based on mid-sized sports motorcycles.

    Competition machines were originally based on production-based motorcycles with
    600 cc to 955 cc engines, depending on the number of cylinders.

    After trials in UK national series British Supersport, from 2022 the regulations
    have changed to allow eligibility of larger-displacement engines, to reflect the
    engine sizes being produced and encourage different manufacturers.'
variables:
  watch_token:
    type: select
    select:
      field: event.code
      values:
        01p: FP
        02s: SPole
        04r1: RACE_1
        06r2: RACE_2
schedule:
  schedule_url: https://raw.githubusercontent.com/dspagnol/motorr-schedule-test1/main/wssp

torrent_acquisition:
- id: torrent_query
  applies_to:
    event_codes:
    - 01p
    - 02s
    - 03wu1
    - 04r1
    - 05wu2
    - 06r2
  indexer_capabilities:
  - public-sports
  query_template: wssp ${season.code} round${round.code}
  torrent_name_regex: WSBK\.${season.code}\.Round${round.code}\..+
file_matchers:
- id: import-dir-motomundo-import-file-watch-directory-selector
  applies_to:
    event_codes:
    - 01p
    - 02s
    - 04r1
    - 06r2
    source_kinds:
    - watch_directory
  priority: 10
  relative_path_regex: '[0-9]+\.MotoMundo\.net\.${season.code}\.R${round.code}\.SSP\.\w+\.${var.watch_token}\.(?:mp4|mkv)$'
- id: import_dir_motomundo-import-file-watch_directory-03wu1
  applies_to:
    event_codes:
    - 03wu1
    source_kinds:
    - watch_directory
  priority: 10
  relative_path_regex: '[0-9]+\.MotoMundo\.net\.${season.code}\.R${round.code}\.SSP\.\w+\.WUP_?1\.(?:mp4|mkv)$'
- id: import_dir_motomundo-import-file-watch_directory-05wu2
  applies_to:
    event_codes:
    - 05wu2
    source_kinds:
    - watch_directory
  priority: 10
  relative_path_regex: '[0-9]+\.MotoMundo\.net\.${season.code}\.R${round.code}\.SSP\.\w+\.WUP_?2\.(?:mp4|mkv)$'
- id: torrent_query-torrent-file-torrent-01p
  applies_to:
    event_codes:
    - 01p
    source_kinds:
    - torrent
  priority: 50
  relative_path_regex: (?:(?:[0-9]{2}\. (?:SSP600|WSSP)/[0-9]{2} - SSP600\.${season.code}\.${round.code}\..+\.Grand\.Prix\.(?:Free\.)?Practice\.(?:ZXX.|ENGLISH.|MULTi.)+(?:1080p|720p)\..+.(?:mkv|mp4))|(?:[0-9]{2}\.
    (?:SSP600|WSSP)/[0-9]{2}\.MotoMundo-WSSP\.${season.code}\.R${round.code}\..+\.FP\.mp4))$
- id: torrent_query-torrent-file-torrent-02s
  applies_to:
    event_codes:
    - 02s
    source_kinds:
    - torrent
  priority: 50
  relative_path_regex: (?:(?:[0-9]{2}\. (?:SSP600|WSSP)/[0-9]{2} - SSP600\.${season.code}\.${round.code}\..+\.Grand\.Prix\.Superpole\.(?:ZXX.|ENGLISH.|MULTi.)+(?:1080p|720p)\..+.(?:mkv|mp4))|(?:[0-9]{2}\.
    (?:SSP600|WSSP)/[0-9]{2}\.MotoMundo-WSSP\.${season.code}\.R${round.code}\..+\.SPole\.mp4))$
- id: torrent_query-torrent-file-torrent-03wu1
  applies_to:
    event_codes:
    - 03wu1
    source_kinds:
    - torrent
  priority: 50
  relative_path_regex: (?:(?:[0-9]{2}\. (?:SSP600|WSSP)/[0-9]{2} - SSP600\.${season.code}\.${round.code}\..+\.Grand\.Prix\.Warm(?:ing)?.Up\.(?:1|One)\.(?:ZXX.|ENGLISH.|MULTi.)+(?:1080p|720p)\..+.(?:mkv|mp4))|(?:[0-9]{2}\.
    (?:SSP600|WSSP)/[0-9]{2}\.MotoMundo-WSSP\.${season.code}\.R${round.code}\..+\.WUP1\.mp4))$
- id: torrent_query-torrent-file-torrent-04r1
  applies_to:
    event_codes:
    - 04r1
    source_kinds:
    - torrent
  priority: 50
  relative_path_regex: (?:(?:[0-9]{2}\. (?:SSP600|WSSP)/[0-9]{2} - SSP600\.${season.code}\.${round.code}\..+\.Grand\.Prix\.Race\.(?:1|One)\.(?:ZXX.|ENGLISH.|MULTi.)+(?:1080p|720p)\..+.(?:mkv|mp4))|(?:[0-9]{2}\.
    (?:SSP600|WSSP)/[0-9]{2}\.MotoMundo-WSSP\.${season.code}\.R${round.code}\..+\.Race1\.mp4))$
- id: torrent_query-torrent-file-torrent-05wu2
  applies_to:
