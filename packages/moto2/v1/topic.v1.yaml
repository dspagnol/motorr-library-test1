schema_version: 1
package:
  code: moto2
  version: 0.1.0
core_compatibility:
  min: 0.0.1
topic:
  code: moto2
  name: Moto2
  description: FIM Moto2 World Championship is the intermediate class of the Fédération
    Internationale de Motocyclisme (FIM) Road Racing World Championship.
variables:
  watch_token:
    type: select
    select:
      field: event.code
      values:
        01fp1: FP1
        02p: PR
        03fp2: FP2
        04q1: Q1
        05q2: Q2
  uindex_token_2:
    type: select
    select:
      field: event.code
      values:
        01fp1: FP1
        02p: Practice
        03fp2: FP2
        06r: Race
  rr_short:
    type: select
    select:
      field: event.code
      values:
        01fp1: FP1
        02p: PR
        03fp2: FP2
        04q1: Q1
        05q2: Q2
        06r: RACE
  rr_short_alt:
    type: select
    select:
      field: event.code
      values:
        01fp1: P1
        02p: PRA
        03fp2: P2
        04q1: Q1
        05q2: Q2
        06r: Race
  rr_long:
    type: select
    select:
      field: event.code
      values:
        01fp1: free.practice.one
        02p: practice
        03fp2: free.practice.two
        04q1: qualifying.one
        05q2: qualifying.two
        06r: Race
schedule:
  schedule_url: https://raw.githubusercontent.com/dspagnol/motorr-schedule-test1/main/moto2

torrent_acquisition:
- id: rutracker
  applies_to:
    event_codes:
    - 01fp1
    - 02p
    - 03fp2
    - 04q1
    - 05q2
    - 06r
  indexer_capabilities:
  - rutracker
  query_template: motogp ${season.code} ${round.code} eng
  listing_title_regex: ^Moto Grand Prix \(MotoGP, Moto2, Moto3(?:, MotoE)?\) ${season.code}
    .+ ${round.code} .* \[.*,.+ENG.*\]$
  torrent_name_regex: MotoGP\.${season.code}\.Round${round.code}\..+
- id: torrent_query
  applies_to:
    event_codes:
    - 01fp1
    - 02p
    - 03fp2
    - 04q1
    - 05q2
    - 06r
  indexer_capabilities:
  - public-sports
  query_template: moto2 ${season.code} round${round.code}
- id: uindex
  applies_to:
    event_codes:
    - 01fp1
    - 02p
    - 03fp2
    - 06r
  indexer_capabilities:
  - uindex
  query_template: moto2 ${season.code} round${round.code}
  listing_title_regex: Moto2 ${season.code} Round${round.code} .+ ${var.uindex_token_2}
    WEB-DL .*
  torrent_name_regex: Moto2 ${season.code} Round${round.code} .+ ${var.uindex_token_2}
    WEB-DL .*
file_matchers:
- id: motomundo-watch
  applies_to:
    event_codes:
    - 01fp1
    - 02p
    - 03fp2
    - 04q1
    - 05q2
    source_kinds:
    - watch_directory
  priority: 10
  relative_path_regex: '[0-9]+\.MotoMundo\.net\.${season.code}\.R${round.code}\.M2\.[^\.]+\.${var.watch_token}\.(?:mp4|mkv)$'
- id: motomundo-watch-06r
  applies_to:
    event_codes:
    - 06r
    source_kinds:
    - watch_directory
  priority: 10
  relative_path_regex: '[0-9]+\.MotoMundo\.net\.${season.code}\.R${round.code}\.M2\.[^\.]+\.RACE(?:-(?:Dorna|VDPass)|)\.(?:mp4|mkv)$'
- id: rutracker-torrent
  applies_to:
    event_codes:
    - 01fp1
    - 02p
    - 03fp2
    - 04q1
    - 05q2
    - 06r
    source_kinds:
    - torrent
  priority: 50
  relative_path_regex: '[0-9]{2}\. Moto2/[0-9]{2}[a-z]?[\.\-].*\W(?:${var.rr_short}|${var.rr_short_alt}|(?<!free\.)${var.rr_long})(?:\W.*)?\.(?:mkv|mp4)$'
- id: uindex-torrent
  applies_to:
    event_codes:
    - 01fp1
    - 02p
    - 03fp2
    - 06r
    source_kinds:
    - torrent
  priority: 40
  relative_path_regex: Moto2 ${season.code} Round${round.code} .+ ${var.uindex_token_2}
    WEB-DL .*.*/Moto2 ${season.code} Round${round.code} .+ ${var.uindex_token_2} WEB-DL
    .*.*\.mkv
