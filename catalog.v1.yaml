- code: f1
  name: Formula One
  description: 'Formula One (F1) is the highest class of worldwide racing for open-wheel
    single-seater formula racing cars sanctioned by the Fédération Internationale
    de l''Automobile (FIA).

    Grands Prix take place in multiple countries and continents on either purpose-built
    circuits or closed roads.'
