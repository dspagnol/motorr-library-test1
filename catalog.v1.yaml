- code: invictafc
  name: Invicta FC
  description: 'Invicta Fighting Championships, also known as Invicta FC, is an American

    professional mixed martial arts (MMA) promotion dedicated to women''s mixed

    martial arts that was founded in 2012 by Janet Martin and Shannon Knapp.

    The promotion is currently owned by the Canadian-based Anthem Sports &

    Entertainment.'
