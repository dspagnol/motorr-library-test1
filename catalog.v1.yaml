- code: wsbk
  name: WorldSBK
  description: 'Superbike World Championship (also known as WorldSBK, SBK, World Superbike,
    WSB, or WSBK) is a

    silhouette road racing series based on heavily modified production sports motorcycles.'
  package:
    version: 0.1.0
    url: https://raw.githubusercontent.com/dspagnol/motorr-library-test1/main/packages/wsbk/v1/topic.v1.yaml
