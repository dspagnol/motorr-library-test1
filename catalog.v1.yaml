- code: wspb
  name: WorldSPB
  description: The Sportbike World Championship (or short abbreviated as WorldSPB)
    is a motorcycle racing competition on paved surfaces, for production-based motorcycles.
    The class replaced the Supersport 300 World Championship which ran for nine seasons
    as the support class for the Superbike World Championship from 2017 up to 2025.
  package:
    version: 0.1.0
    url: https://raw.githubusercontent.com/dspagnol/motorr-library-test1/main/packages/wspb/v1/topic.v1.yaml
    topic_sha256: 5e5010b73b39d0da05d51b07b746cf084639cead24c23a0cb4fdba63dd60a4ad
  core_compatibility:
    min: 0.0.1
- code: wssp
  name: WorldSSP
  description: 'The Supersport World Championship, abbreviated to WorldSSP, is a motorcycle
    racing competition on hard-surfaced circuits, based on mid-sized sports motorcycles.

    Competition machines were originally based on production-based motorcycles with
    600 cc to 955 cc engines, depending on the number of cylinders.

    After trials in UK national series British Supersport, from 2022 the regulations
    have changed to allow eligibility of larger-displacement engines, to reflect the
    engine sizes being produced and encourage different manufacturers.'
  package:
    version: 0.1.0
    url: https://raw.githubusercontent.com/dspagnol/motorr-library-test1/main/packages/wssp/v1/topic.v1.yaml
    topic_sha256: c4e6cedad4eb92b6b7829434145d02329ae35cf1530a46f0eeb895fc8a1a29e1
  core_compatibility:
    min: 0.0.1
- code: wssp300
  name: WorldSSP300
  description: 'The Supersport 300 World Championship (or short abbreviated as WorldSSP300)
    is a motorcycle racing competition on paved surfaces, for production-based motorcycles.

    Created in 2017, the championship runs as a support class to the Superbike World
    Championship.'
  package:
    version: 0.1.0
    url: https://raw.githubusercontent.com/dspagnol/motorr-library-test1/main/packages/wssp300/v1/topic.v1.yaml
    topic_sha256: b78370063ef1142dad8c6debc485d8f45c63b118d222f61b7e31c9b28f0815a6
  core_compatibility:
    min: 0.0.1
- code: wwcr
  name: WorldWCR
