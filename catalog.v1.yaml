- code: motogp
  name: MotoGP
  description: The MotoGP World Championship is the premier class of motorcycle road
    racing events held on road circuits sanctioned by the Fédération Internationale
    de Motocyclisme (FIM). It is the top division of the FIM Road Racing World Championship
    Grand Prix.
